<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Nepal Deep Blue stream: Left → Right -->
    <linearGradient id="bluePulseL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#003893" stop-opacity="0" />
      <stop offset="55%"  stop-color="#003893" stop-opacity="0.9" />
      <stop offset="82%"  stop-color="#1a5fd4" stop-opacity="1" />
      <stop offset="100%" stop-color="#003893" stop-opacity="0" />
    </linearGradient>

    <!-- Nepal Crimson stream: Right → Left -->
    <linearGradient id="crimsonPulseL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#DC143C" stop-opacity="0" />
      <stop offset="55%"  stop-color="#DC143C" stop-opacity="0.9" />
      <stop offset="82%"  stop-color="#b80c2f" stop-opacity="1" />
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0" />
    </linearGradient>

    <!-- Static wire track for light mode -->
    <linearGradient id="baseTrackL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d0d7de" stop-opacity="0.2" />
      <stop offset="20%"  stop-color="#d0d7de" stop-opacity="0.9" />
      <stop offset="50%"  stop-color="#003893" stop-opacity="0.4" />
      <stop offset="80%"  stop-color="#d0d7de" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d0d7de" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background dashed circuit track -->
  <line x1="30" y1="12" x2="770" y2="12"
        stroke="url(#baseTrackL)" stroke-width="1.2" stroke-dasharray="3 7" />

  <!-- Blue laser stream: Left → Right (3 packets) -->
  <line x1="30" y1="12" x2="770" y2="12"
        stroke="url(#bluePulseL)" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="90 170 90 170 90 170">
    <animate attributeName="stroke-dashoffset" from="780" to="0" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Crimson counter-stream: Right → Left -->
  <line x1="30" y1="12" x2="770" y2="12"
        stroke="url(#crimsonPulseL)" stroke-width="1.8"
        stroke-linecap="round" stroke-dasharray="70 230 70 230">
    <animate attributeName="stroke-dashoffset" from="0" to="600" dur="3.6s" repeatCount="indefinite" />
  </line>

  <!-- Blue particles Left → Right -->
  <circle cy="12" r="2.5" fill="#003893">
    <animate attributeName="cx" values="30;770" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.5;1;0.5;0" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cy="12" r="4.5" fill="#1a5fd4" opacity="0.3">
    <animate attributeName="cx" values="30;770" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="2.5;5;2.5" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Crimson particles Right → Left -->
  <circle cy="12" r="2" fill="#DC143C">
    <animate attributeName="cx" values="770;30" dur="3.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.5;1;0.5;0" dur="3.6s" repeatCount="indefinite" />
  </circle>

  <!-- Circuit nodes -->
  <circle cx="30"  cy="12" r="3.5" fill="#d0d7de" stroke="#003893" stroke-width="1" />
  <circle cx="215" cy="12" r="2.5" fill="#d0d7de" />
  <circle cx="400" cy="12" r="4"   fill="#003893" />
  <circle cx="400" cy="12" r="2"   fill="#DC143C" />
  <circle cx="585" cy="12" r="2.5" fill="#d0d7de" />
  <circle cx="770" cy="12" r="3.5" fill="#d0d7de" stroke="#DC143C" stroke-width="1" />
</svg>
