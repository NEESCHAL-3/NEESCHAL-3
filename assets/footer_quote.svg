<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 54" width="100%" height="54" fill="none">
  <defs>
    <!-- Nepal flowing gradient on "learning deeply" -->
    <linearGradient id="quoteFlowDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a5fd4">
        <animate attributeName="stop-color" values="#1a5fd4;#e6edf3;#DC143C;#1a5fd4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#e6edf3">
        <animate attributeName="stop-color" values="#e6edf3;#DC143C;#1a5fd4;#e6edf3" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DC143C">
        <animate attributeName="stop-color" values="#DC143C;#1a5fd4;#e6edf3;#DC143C" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Animated border glow -->
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003893" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1a5fd4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle inner backdrop glow -->
    <radialGradient id="innerGlowDark" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a5fd4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pill background with gradient border -->
  <rect x="1" y="1" width="718" height="52" rx="26" fill="#0d1117" stroke="url(#borderGradDark)" stroke-width="1.3"/>
  <rect x="2" y="2" width="716" height="50" rx="25" fill="url(#innerGlowDark)"/>

  <!-- Left Git commit branch / node -->
  <g transform="translate(32, 27)">
    <line x1="-14" y1="0" x2="-6" y2="0" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="14" y2="0" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" stroke="#DC143C" stroke-width="2" fill="#0d1117"/>
    <circle cx="0" cy="0" r="3" fill="#1a5fd4">
      <animate attributeName="r" values="2;3.6;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#1a5fd4;#DC143C;#1a5fd4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bold developer motto text -->
  <text x="60" y="32.5"
        font-family="ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace"
        font-size="12.8" font-weight="700" letter-spacing="-0.2px">
    <tspan fill="#e6edf3">Building quietly</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="url(#quoteFlowDark)">learning deeply</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#e6edf3">improving one commit at a time</tspan>
    <tspan fill="#DC143C" font-weight="900">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>_
    </tspan>
  </text>

  <!-- Right status pill badge: [● main] -->
  <g transform="translate(628, 16)">
    <rect x="0" y="0" width="66" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.2" fill="#238636">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.8;3.5;2.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="14.5"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace"
          font-size="10" font-weight="700" fill="#8b949e">main</text>
  </g>
</svg>
